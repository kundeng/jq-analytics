[project]
name = "jq-analytics"
version = "0.9.2"
description = "A jq module for tables and statistics: joins, grouping, percentiles, windows, state machines, trees, graphs, measures at several levels, and local time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jq==1.13.0", "duckdb==2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jq_analytics"]
